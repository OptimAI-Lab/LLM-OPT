  maxdepth: 3         # how deep the sidebar expands (H1–H3)
chapters:
  - file: lectures/Chapter1/intro  
    title: Introduction 
    sections:
      - file: lectures/Chapter1/course_outline
        title: Course Outline
      - file: notations
        title: Notations
    title: Introduction to Optimization
